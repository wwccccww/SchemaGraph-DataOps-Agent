    database_id: ecommerce
    difficulty: basic
    dialect: postgres
    question: "统计2026年3月状态为已支付的订单数量"
    gold_sql: |-
      SELECT '2026-03' AS order_month, 'PAID' AS order_status, COUNT(*)::bigint AS order_count
      FROM t_order
      WHERE order_status = 'PAID'
        AND created_at >= TIMESTAMP '2026-03-01 00:00:00'
        AND created_at < TIMESTAMP '2026-04-01 00:00:00'
    required_tables:
      - "t_order"
    required_junctions: []
    order_sensitive: false
    numeric_tolerance: null
    expected_columns:
