  - id: custom_basic_003
    source: custom
    source_version: ecommerce-v1
    database_id: ecommerce
    difficulty: basic
    dialect: postgres
    question: "查询自营商家在售的美妆商品"
    gold_sql: |-
      SELECT p.product_id, p.product_name, m.merchant_name
      FROM t_product AS p
      JOIN t_category AS c ON p.category_id = c.category_id
      JOIN t_merchant AS m ON p.merchant_id = m.merchant_id
      WHERE c.category_name = '美妆'
        AND m.is_self_operated IS TRUE
    required_tables:
      - "t_product"
      - "t_category"
      - "t_merchant"
    required_junctions: []
    order_sensitive: false
    numeric_tolerance: null
    expected_columns:
      - "product_id"
      - "product_name"
      - "merchant_name"
    anchor_date: "2026-10-01"
    tags:
      - "filter"
    semantic_contract:
      projections:
        - "product_id"
        - "product_name"
        - "merchant_name"
      group_keys: []
      filters:
        - "category_name = 美妆"
        - "商家为自营"
        - "投影商品编号、商品名称和商家名称"
        - "品类名称只匹配当前节点，不包含子品类"
      category_scope: exact
      time_window: null
      dedup_key: null
    oracle:
