    difficulty: medium
    dialect: postgres
    question: "统计2026年9月华北大区使用满减优惠券的已支付订单数"
    gold_sql: |-
      SELECT r.region_name, c.coupon_type, COUNT(DISTINCT o.order_id)::bigint AS order_count
      FROM t_order AS o
      JOIN t_user AS u ON o.user_id = u.user_id
      JOIN t_user_region_map AS urm ON u.user_id = urm.user_id
      JOIN t_region AS r ON urm.region_id = r.region_id
      JOIN t_order_coupon_rel AS ocr ON o.order_id = ocr.order_id
      JOIN t_coupon AS c ON ocr.coupon_id = c.coupon_id
      WHERE o.order_status = 'PAID'
        AND r.region_name = '华北'
        AND c.coupon_type = 'full_reduction'
        AND o.created_at >= TIMESTAMP '2026-09-01 00:00:00'
        AND o.created_at < TIMESTAMP '2026-10-01 00:00:00'
      GROUP BY r.region_name, c.coupon_type
    required_tables:
      - "t_order"
      - "t_user"
      - "t_region"
