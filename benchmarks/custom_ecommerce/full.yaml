contract_version: "1.0"
cases:
  - id: custom_basic_001
    source: custom
    source_version: ecommerce-v1
    database_id: ecommerce
    difficulty: basic
    dialect: postgres
    question: "按等级编号升序查询全部会员等级的名称和折扣率"
    gold_sql: |-
      SELECT level_id, level_name, discount_rate
      FROM t_user_level
      ORDER BY level_id
    required_tables:
      - "t_user_level"
    required_junctions: []
    order_sensitive: true
    numeric_tolerance: null
    expected_columns:
      - "level_id"
      - "level_name"
      - "discount_rate"
    anchor_date: "2026-10-01"
    tags:
      - "dimension"
      - "order"
  - id: custom_basic_002
    source: custom
    source_version: ecommerce-v1
    database_id: ecommerce
    difficulty: basic
    dialect: postgres
    question: "统计每个会员等级的用户数量"
    gold_sql: |-
      SELECT ul.level_name, COUNT(*)::bigint AS user_count
      FROM t_user AS u
      JOIN t_user_level AS ul ON u.user_level_id = ul.level_id
      GROUP BY ul.level_id, ul.level_name
    required_tables:
      - "t_user"
      - "t_user_level"
    required_junctions: []
    order_sensitive: false
    numeric_tolerance: null
    expected_columns:
      - "level_name"
      - "user_count"
    anchor_date: "2026-10-01"
    tags:
      - "aggregation"
  - id: custom_basic_003
    source: custom
    source_version: ecommerce-v1
    database_id: ecommerce
    difficulty: basic
    dialect: postgres
    question: "查询自营商家在售的美妆商品"
    gold_sql: |-
      SELECT p.product_id, p.product_name, m.merchant_name
      FROM t_product AS p
      JOIN t_category AS c ON p.category_id = c.category_id
      JOIN t_merchant AS m ON p.merchant_id = m.merchant_id
      WHERE c.category_name = '美妆'
        AND m.is_self_operated IS TRUE
    required_tables:
      - "t_product"
      - "t_category"
      - "t_merchant"
    required_junctions: []
    order_sensitive: false
    numeric_tolerance: null
    expected_columns:
      - "product_id"
      - "product_name"
      - "merchant_name"
    anchor_date: "2026-10-01"
    tags:
      - "filter"
