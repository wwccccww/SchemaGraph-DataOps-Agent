cases:
  - id: tpcds_complex_001
    source: tpcds-derived
    source_version: tpcds-v2.10.0+5a3a81796992b725c2a8b216767e142609966752
    database_id: tpcds
    difficulty: complex
    dialect: postgres
    question: "统计 2001 年能关联到当前住址的顾客，在各州门店购买各商品类别的销售金额。"
    gold_sql: |-
      WITH sold AS (
          SELECT ss_item_sk, ss_store_sk, ss_customer_sk, ss_sold_date_sk,
                 ss_ext_sales_price
          FROM store_sales
      )
      SELECT store.s_state AS store_state,
             item.i_category AS item_category,
             date_dim.d_year AS sales_year,
             SUM(sold.ss_ext_sales_price) AS sales_amount
      FROM sold
      JOIN date_dim ON sold.ss_sold_date_sk = date_dim.d_date_sk
      JOIN item ON sold.ss_item_sk = item.i_item_sk
      JOIN store ON sold.ss_store_sk = store.s_store_sk
      JOIN customer ON sold.ss_customer_sk = customer.c_customer_sk
      JOIN customer_address
        ON customer.c_current_addr_sk = customer_address.ca_address_sk
      WHERE date_dim.d_year = 2001
      GROUP BY store.s_state, item.i_category, date_dim.d_year
    required_tables:
      - "customer"
      - "customer_address"
      - "date_dim"
      - "item"
      - "store"
      - "store_sales"
    required_junctions: []
    order_sensitive: false
    numeric_tolerance: null
    expected_columns:
      - "store_state"
      - "item_category"
      - "sales_year"
      - "sales_amount"
    anchor_date: "2026-10-01"
    tags:
      - "tpcds-derived"
      - "cte"
      - "join"
      - "aggregation"
    semantic_contract:
      projections:
        - "store_state"
        - "item_category"
        - "sales_year"
        - "sales_amount"
      group_keys:
        - "store_state"
        - "item_category"
        - "sales_year"
      filters:
        - "calendar_year=2001"
        - "primary_fact=store_sales"
      category_scope: exact
      time_window:
        start: "2001-01-01"
        end: "2002-01-01"
        anchor_date: "2026-10-01"
      dedup_key: null
  - id: tpcds_complex_002
    source: tpcds-derived
    source_version: tpcds-v2.10.0+5a3a81796992b725c2a8b216767e142609966752
    database_id: tpcds
    difficulty: complex
    dialect: postgres
    question: "统计 2001 年购买过直邮促销商品的顾客，按教育程度和信用评级汇总净利润。"
    gold_sql: |-
      SELECT customer_demographics.cd_education_status AS education_status,
             customer_demographics.cd_credit_rating AS credit_rating,
             date_dim.d_year AS sales_year,
             SUM(store_sales.ss_net_profit) AS net_profit
      FROM store_sales
      JOIN date_dim ON store_sales.ss_sold_date_sk = date_dim.d_date_sk
      JOIN item ON store_sales.ss_item_sk = item.i_item_sk
      JOIN customer ON store_sales.ss_customer_sk = customer.c_customer_sk
      JOIN customer_demographics
        ON customer.c_current_cdemo_sk = customer_demographics.cd_demo_sk
      WHERE date_dim.d_year = 2001
        AND store_sales.ss_item_sk IN (
            SELECT promotion.p_item_sk
            FROM promotion
            WHERE promotion.p_channel_dmail = 'Y'
              AND promotion.p_item_sk IS NOT NULL
        )
      GROUP BY customer_demographics.cd_education_status,
               customer_demographics.cd_credit_rating,
               date_dim.d_year
    required_tables:
      - "customer"
      - "customer_demographics"
      - "date_dim"
      - "item"
      - "promotion"
      - "store_sales"
    required_junctions: []
    order_sensitive: false
    numeric_tolerance: null
    expected_columns:
      - "education_status"
      - "credit_rating"
      - "sales_year"
      - "net_profit"
    anchor_date: "2026-10-01"
    tags:
      - "tpcds-derived"
      - "subquery"
      - "join"
      - "aggregation"
    semantic_contract:
      projections:
        - "education_status"
        - "credit_rating"
