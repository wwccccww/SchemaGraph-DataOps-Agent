  - id: bird_0106
    source: bird
    source_version: bird-sql-dev-20251106@3c11fb193e5439b338e23677fa0aae11e8b85db9+anchor20261001
    database_id: financial
    difficulty: complex
    dialect: sqlite
    question: "For the client who received a credit card on October 21, 1996, what are the complete details of their largest transaction, including their personal information, district details, and any associated loans or orders?"
    gold_sql: |-
      WITH TransactionStats AS (
          SELECT 
              T4.account_id,
              T4.trans_id,
              T4.amount,
              T4.type,
              T4.date,
              T4.balance,
              RANK() OVER (PARTITION BY T4.account_id ORDER BY T4.amount DESC) as amount_rank
          FROM trans AS T4
      ),
      ClientCards AS (
          SELECT 
              T2.client_id,
              T3.account_id,
              T1.card_id,
              T1.issued,
              T1.type as card_type,
              T5.gender,
              T5.birth_date,
              (strftime('%Y', '2026-10-01') - strftime('%Y', T5.birth_date)) - 
                  (strftime('%m-%d', '2026-10-01') < strftime('%m-%d', T5.birth_date)) as client_age
          FROM card AS T1
          JOIN disp AS T2 ON T1.disp_id = T2.disp_id
          JOIN account AS T3 ON T2.account_id = T3.account_id
          JOIN client AS T5 ON T2.client_id = T5.client_id
          WHERE T1.issued = '1996-10-21'
      ),
      DistrictInfo AS (
          SELECT 
              d.district_id,
              d.A2 as district_name,
              d.A3 as region,
              d.A11 as avg_salary,
              d.A12 as unemployment_rate_95
          FROM district d
      )
      
      SELECT 
          cc.client_id,
          cc.card_id,
          cc.card_type,
          cc.gender,
          cc.client_age,
          di.district_name,
          di.region,
          ts.trans_id,
          ts.amount as largest_transaction_amount,
          ts.type as transaction_type,
          ts.date as transaction_date,
          ts.balance as balance_after_transaction,
          CASE 
              WHEN ts.amount > 10000 THEN 'High Value'
              WHEN ts.amount > 5000 THEN 'Medium Value'
              ELSE 'Low Value'
          END as transaction_category,
          CASE 
              WHEN l.loan_id IS NOT NULL THEN 'Has Loan'
              ELSE 'No Loan'
          END as loan_status,
          l.amount as loan_amount,
          o.order_id,
          o.bank_to
      FROM ClientCards cc
      JOIN TransactionStats ts ON cc.account_id = ts.account_id AND ts.amount_rank = 1
      JOIN client c ON cc.client_id = c.client_id
      JOIN DistrictInfo di ON c.district_id = di.district_id
      LEFT JOIN loan l ON cc.account_id = l.account_id
      LEFT JOIN "order" o ON cc.account_id = o.account_id
      ORDER BY ts.amount DESC
      LIMIT 1
    required_tables:
