      - "paid_amount_percentage"
      - "successful_loans_percentage"
      - "successful_loans"
      - "total_loans"
      - "paid_amount"
      - "total_amount"
      - "avg_interest_paid_successful"
      - "avg_interest_paid_all"
      - "overall_percentage"
