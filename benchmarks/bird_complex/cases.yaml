      - "account_id"
      - "district_name"
      - "region_name"
      - "max_loan_amount"
      - "avg_loan_amount"
      - "loan_count"
      - "gender"
      - "age"
      - "income_category"
      - "transaction_count"
      - "savings_ratio"
      - "region_loan_rank"
    anchor_date: "2026-10-01"
    tags:
      - "bird"
      - "challenging"
      - "financial"
    semantic_contract:
      projections:
        - "account_id"
