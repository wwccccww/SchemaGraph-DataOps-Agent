    database_id: financial
    difficulty: complex
    dialect: sqlite
    question: "What is the district name, number of inhabitants, total number of clients, number of male clients, and percentage of male clients for the most populated district in the south Bohemia region?"
    gold_sql: |-
      WITH RegionStats AS (
          SELECT 
              d.district_id,
              d.A3 AS region,
              CAST(d.A4 AS INTEGER) AS inhabitants,
              COUNT(DISTINCT c.client_id) AS total_clients,
              SUM(CASE WHEN c.gender = 'M' THEN 1 ELSE 0 END) AS male_clients,
              RANK() OVER (PARTITION BY d.A3 ORDER BY CAST(d.A4 AS INTEGER) DESC) AS population_rank
          FROM 
              district d
          LEFT JOIN 
              client c ON d.district_id = c.district_id
          WHERE 
              d.A3 = 'south Bohemia'
          GROUP BY 
              d.district_id, d.A3, d.A4
      )
      SELECT 
          rs.district_id,
          d.A2 AS district_name,
          rs.region,
          rs.inhabitants,
          rs.total_clients,
          rs.male_clients,
          CASE 
              WHEN rs.total_clients > 0 THEN ROUND((rs.male_clients * 100.0 / rs.total_clients), 2)
              ELSE 0 
          END AS pct_male
      FROM 
          RegionStats rs
      JOIN 
          district d ON rs.district_id = d.district_id
      WHERE 
          rs.population_rank = 1
      ORDER BY 
          rs.inhabitants DESC, rs.district_id
      LIMIT 1;
