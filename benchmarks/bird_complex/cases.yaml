      - "district_name"
      - "region"
      - "loan_count"
      - "avg_loan_amount"
      - "active_loans"
      - "completed_loans"
      - "transaction_count"
      - "total_income"
      - "total_expense"
      - "net_balance"
      - "last_transaction_date"
      - "card_count"
      - "card_types"
      - "client_category"
      - "transaction_rank"
