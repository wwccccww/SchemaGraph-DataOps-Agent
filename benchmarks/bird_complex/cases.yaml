      - "district_name"
      - "region"
      - "gender"
      - "birth_date"
      - "loan_amount"
      - "loan_duration_months"
      - "status_description"
      - "district_avg_salary"
      - "unemployment_rate_1995"
      - "district_total_loans"
      - "district_avg_loan_amount"
      - "district_problematic_loans"
      - "district_loan_rank"
      - "total_transactions"
    anchor_date: "2026-10-01"
