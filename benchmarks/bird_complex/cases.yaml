    semantic_contract:
      projections:
        - "district_count"
        - "total_female_clients"
        - "average_female_salary"
        - "average_female_age"
        - "total_female_accounts"
        - "total_female_loans"
        - "average_female_loan_amount"
        - "active_female_loans"
        - "completed_female_loans"
        - "defaulted_female_loans"
        - "regions_represented"
      group_keys:
        - "total_female_clients"
        - "average_female_salary"
        - "average_female_age"
        - "total_female_accounts"
        - "total_female_loans"
