name: External Gold

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "app/evaluation/**"
      - "benchmarks/bird_complex/**"
      - "benchmarks/tpcds_derived/**"
      - "tests/unit/test_external_*.py"
      - "tests/integration/test_external_gold.py"

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/unit/test_external_gold.py tests/unit/test_external_cases.py tests/unit/test_external_release.py tests/unit/test_external_model.py tests/unit/test_external_model_cli.py tests/unit/test_replay_amend.py tests/unit/test_frozen_contract.py tests/unit/test_bird_contracts.py tests/unit/test_tpcds_contracts.py tests/unit/test_tpcds_shape_hints.py tests/unit/test_generic_shape_hints.py tests/unit/test_badcase_join_semantics.py tests/unit/test_badcase_sqlite_dialect.py -q
      - run: uv run python -m app.evaluation.external_data check-external-release

  replay-gate:
    if: vars.BIRD_DATABASE_ROOT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/unit/test_p1_replay_gate.py -q
        env:
          BIRD_DATABASE_ROOT: ${{ vars.BIRD_DATABASE_ROOT }}

  smoke:
    if: vars.EXTERNAL_GOLD_TESTS == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/integration/test_external_gold.py -q
        env:
          EXTERNAL_GOLD_TESTS: "1"
          BIRD_DATABASE_ROOT: ${{ vars.BIRD_DATABASE_ROOT }}
