name: External Gold

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "app/evaluation/**"
      - "app/agents/text_to_sql/**"
      - "benchmarks/bird_complex/**"
      - "benchmarks/tpcds_derived/**"
      - "benchmarks/custom_ecommerce/**"
      - "tests/unit/test_custom_cases.py"
      - "scripts/verify_external_gold.sh"
      - "scripts/replay_bird_*.sh"
      - "app/llm/gateway.py"
      - "app/evaluation/llm_preflight.py"
      - "app/evaluation/p0_measured_summary.py"
      - "app/evaluation/p0_benchmark_docs.py"
      - "scripts/apply_p0_measured_benchmark.sh"
      - "scripts/replay_tpcds_baseline.sh"
      - "scripts/p1_release_gate.sh"
      - "scripts/print_external_p0_status.sh"
      - "scripts/run_bird_p0_full_eval_twice.sh"
      - "scripts/run_tpcds_p0_full_eval_twice.sh"
      - "scripts/run_external_p0_full_eval_twice.sh"
      - "scripts/p0_post_billing_acceptance.sh"
      - "scripts/wait_for_billing_and_run_p0.sh"
      - "scripts/fetch_bird_dev_databases.sh"
      - "tests/unit/test_external_*.py"
      - "tests/unit/test_p0_external_measured_baseline.py"
      - "tests/unit/test_p1_replay_gate.py"
      - "tests/unit/test_bird_profile_inventory.py"
      - "tests/unit/test_bird_contracts.py"
      - "tests/unit/test_frozen_contract.py"
      - "tests/unit/test_generic_shape_hints.py"
      - "tests/unit/test_bird_peak_executable.py"
      - "docs/benchmark.md"
      - "docs/external_gold_p0_runbook.md"
      - "tests/unit/test_print_external_p0_status.py"
      - "tests/unit/test_external_gold_runbook_docs.py"
      - "tests/unit/test_run_bird_p0_full_eval_script.py"
      - "tests/unit/test_run_tpcds_p0_full_eval_script.py"
      - "tests/unit/test_run_external_p0_full_eval_script.py"
      - "tests/unit/test_llm_preflight.py"
      - "tests/unit/test_p1_release_gate_script.py"
      - "tests/unit/test_p0_post_billing_acceptance_script.py"
      - "tests/unit/test_wait_for_billing_and_run_p0_script.py"
      - "tests/unit/test_p0_measured_summary.py"
      - "tests/unit/test_tpcds_postgres_reachable.py"
      - "tests/integration/test_external_gold.py"

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/unit/test_custom_cases.py::test_python_oracle_attestation_covers_every_case tests/unit/test_external_gold_unit.py tests/unit/test_external_cases.py tests/unit/test_external_release.py tests/unit/test_external_model_unit.py tests/unit/test_external_model_cli.py tests/unit/test_replay_amend.py tests/unit/test_profile_autofix.py tests/unit/test_workflow_profile_autofix_validate.py tests/unit/test_bird_autofix_measured_path.py tests/unit/test_p0_external_measured_baseline.py tests/unit/test_p1_replay_gate.py tests/unit/test_bird_peak_executable.py tests/unit/test_print_external_p0_status.py tests/unit/test_run_bird_p0_full_eval_script.py tests/unit/test_run_tpcds_p0_full_eval_script.py tests/unit/test_run_external_p0_full_eval_script.py tests/unit/test_llm_preflight.py tests/unit/test_p1_release_gate_script.py tests/unit/test_p0_post_billing_acceptance_script.py tests/unit/test_wait_for_billing_and_run_p0_script.py tests/unit/test_p0_measured_summary.py tests/unit/test_p0_benchmark_docs.py tests/unit/test_external_gold_runbook_docs.py tests/unit/test_fetch_bird_dev_databases_script.py tests/unit/test_tpcds_postgres_reachable.py tests/unit/test_bird_profile_inventory.py tests/unit/test_frozen_contract.py tests/unit/test_bird_contracts.py tests/unit/test_tpcds_contracts.py tests/unit/test_tpcds_shape_hints.py tests/unit/test_generic_shape_hints.py tests/unit/test_badcase_join_semantics.py tests/unit/test_badcase_sqlite_dialect.py tests/unit/test_sqlite_read_only.py -q
      - run: uv run python -m app.evaluation.external_data check-external-release

  replay-gate:
    if: vars.BIRD_DATABASE_ROOT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/unit/test_p1_replay_gate.py -q
        env:
          BIRD_DATABASE_ROOT: ${{ vars.BIRD_DATABASE_ROOT }}

  smoke:
    if: vars.EXTERNAL_GOLD_TESTS == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/integration/test_external_gold.py -q
        env:
          EXTERNAL_GOLD_TESTS: "1"
          BIRD_DATABASE_ROOT: ${{ vars.BIRD_DATABASE_ROOT }}
