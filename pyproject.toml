[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schemagraph-dataops-agent"
version = "0.1.0"
description = "Text-to-SQL and slow SQL diagnosis agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0",
  "faker>=33.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "langgraph>=1.2.12",
  "networkx>=3.4",
  "opentelemetry-api>=1.45.0",
  "opentelemetry-sdk>=1.45.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "sqlglot>=30.21.0",
  "tokenizers>=0.23.2",
  "uvicorn>=0.32.0",
]

[dependency-groups]
retrieval = [
  "sentence-transformers>=3.3.0",
]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that require PostgreSQL 16 with pgvector",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "faker", "faker.*", "networkx", "networkx.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
